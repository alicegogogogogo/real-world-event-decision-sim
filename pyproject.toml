[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-world-event-decision-sim"
version = "0.1.0"
description = "Backend foundation for real-world event decision simulation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["event_sim*"]

